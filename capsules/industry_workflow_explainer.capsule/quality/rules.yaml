rules:
- id: final_video_required
  type: artifact_required
  severity: blocker
  category: final_video
  rule: 成片阶段须有实际可播放视频；文案或分镜阶段不能宣称视频已完成。
- id: copywriting_structure_contract_required
  type: copy_gate
  severity: blocker
  category: copy
  rule: 策划输出须覆盖 runtime 的文案结构字段，口播呈现一项任务从材料到产物、修改和复用的因果链。
- id: first_three_seconds_hook_required
  type: copy_gate
  severity: blocker
  category: copy
  rule: 开头前 3 秒给出与本期任务相关的停留理由。有合适成果素材时，第一镜直接展示效果或真实对照，口播点明看点；没有时从听众的具体任务或麻烦切入。已确认开头优先；拒绝寒暄、空泛热点、无关自我介绍和未经证实的紧迫感。
- id: grounded_workflow_required
  type: copy_gate
  severity: blocker
  category: copy
  rule: 材料、工具能力和专业说法有依据；不把示例、模型推断或未测效率当成已验证成果。
- id: natural_copy_review_required
  type: copy_gate
  severity: blocker
  category: copy
  rule: 初稿经作者自改及实际顺读，保留已确认开头；字数口径、估计时长与测量结果区分。
- id: human_revision_and_reuse_required
  type: copy_gate
  severity: blocker
  category: copy
  rule: 说明至少一处人工判断或修改，并明确下一轮替换的输入、保留的方法及仍须核查的内容。
- id: evidence_alignment_required
  type: visual_gate
  severity: blocker
  category: visual
  rule: 成片中的操作、成果和修改与旁白相符；实操界面真实，关键区域与字幕可读。
- id: motion_audio_review_required
  type: motion_gate
  severity: blocker
  category: motion
  rule: 回看静帧报警与完整连续音画；排除卡顿、口型漂移、重复帧补时长和无意义运动。
- id: presenter_visual_language
  type: visual_gate
  severity: blocker
  category: visual
  rule: 检查人物、实操、配图、对照的实际样帧与连续片段：白字描边字幕清晰且位置稳定，重点词不遮主体，材料、时间、关系、修改使用适合的图形，动画在相应语义处发生。不能用整片重复列表或开头一次性弹入代替过程解释。
- id: presenter_region_motion
  type: motion_gate
  severity: blocker
  category: motion
  rule: 数字人出镜段须检查排除字幕和贴片的人脸/口部区域，并核对可疑帧与源片段时间映射。字幕在变或整片模型评价通过，不能代替人物局部运动检查；重复读取旧帧、口播继续而人物冻结时禁止交付。
- id: authoring_model_execution
  type: copy_gate
  severity: blocker
  category: copy
  rule: 新增或改写口播须核对实际调用记录：初稿与自然表达修改均由本期解析出的 authoring_model 执行，未明确覆盖时采用输入合同的默认模型。模型不可用、未实际调用或由执行助手代写时，不得冒称已完成指定作者流程；已确认且未修改的稿件可直接沿用。
- id: full_writing_reference_used
  type: copy_gate
  severity: blocker
  category: copy
  rule: 新增口播与作者自改的调用输入须包含 assets/writing-reference.txt 全文；仅提供摘要、结构清单或风格要求不算完成参考。检查工作情境、细节展开和自然衔接，且没有把参考中的产品能力、个人经历或效率数字移作本期事实。已确认且未修改的稿件可直接沿用。
- id: showcase_opening_selection
  type: visual_gate
  severity: blocker
  category: visual
  rule: 核对 opening_selection 与第一镜：有来源可核对、与主题相关且手机上能看清效果的素材时，优先 showcase_first，并检查第一帧和前 3 秒实际呈现；采用 task_first 时记录素材不适合的原因或已确认开头依据。对照须标清对象与条件，不用不同主题的复刻证明同条件等效。
- id: presenter_supports_evidence
  type: visual_gate
  severity: blocker
  category: visual
  rule: 逐段核对画面与讲述：数字人用于判断解释、步骤衔接或缺少直接素材的抽象内容，不设固定开场和收尾；不能用人物讲话替代关键操作与成果证据。实际操作缺证据时补录，动画修改须明确标为示意。
- id: persistent_title_when_requested
  type: visual_gate
  severity: blocker
  category: visual
  rule: 仅在 title_display 为 persistent 时检查：主标题逐字沿用已确认内容，封面一致，第一帧至最后一帧、人物段和跨场景转场均可见；不被原段落标题覆盖，不遮脸、口部、关键成果和字幕。section 模式记为不适用。
