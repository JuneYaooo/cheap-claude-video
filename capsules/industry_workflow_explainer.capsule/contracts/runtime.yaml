roles: {}
output_contract:
  final_video: required
  has_narration: true
video_elements:
  fixed:
    timing_master: narration
    content_before_visual_planning: true
  defaults:
    opening_selection_policy: showcase_first_when_evidence_suitable
    presenter_placement: explanation_as_needed
  user_overridable: {}
  forbidden:
  - fabricated_tool_interface
  - sentence_time_stretch_to_reference
  - unmeasured_efficiency_claim
copywriting_structure_contract:
  topic_to_angle_required: true
  natural_language_review_required: true
  hook_variants_required: 3
  true_first_line_audit_required: true
  viewer_pressure_required: false
  counterintuitive_thesis_required: false
  concrete_scene_required: true
  cover_title_alignment_required: true
  required_outputs:
  - raw_topic
  - audience_pressure
  - common_misread
  - viral_angle_candidates
  - recommended_angle
  - first_3_seconds
  - first_20_seconds
  - script_outline
  - cover_text
  - title
  - risk_notes
  - workflow_chain
  - human_revision
  - next_cycle_inputs
  - character_count
  - estimated_duration
  - opening_selection
  - visual_evidence_plan
  opening_gate:
    max_seconds: 3
    must_contain_one_of:
    - recognizable job situation
    - concrete recurring task
    - specific work friction
    - desired work outcome
    - visible relevant result or comparison with a clear viewing point
    reject_if_only:
    - generic AI trend
    - soft greeting
    - unsupported urgency
    - unexplained slogan
  opening_selection_contract:
    modes:
    - showcase_first
    - task_first
    required_fields:
    - mode
    - rationale
    - selected_assets
    - first_shot_layout
    - visible_payoff
    - supported_claim
    asset_fields:
    - source
    - usable_range
    - subject
    - comparison_conditions
    task_first_allows_empty_selected_assets: true
    approved_opening_has_priority: true
