examples:
- label: 虚构示例：人事岗位新人入职安排
  usage: 仅说明迁移方式，事实和工具能力须在本期另行核实
  task: 整理下一批新人的入职安排
  materials:
  - 已授权的岗位培训清单
  - 公共会议室日历
  - 不含个人信息的往期问题汇总
  workflow:
  - 整理需要完成的培训项目
  - 结合讲师和场地安排找冲突
  - 输出带责任人及依据的安排草案
  - 由人确认岗位差异并修改不合适的顺序
  - 保存流程，下批替换培训需求和日历
  unsupported_claims:
  - 不宣称已经运行成功
  - 不预设节省时数
