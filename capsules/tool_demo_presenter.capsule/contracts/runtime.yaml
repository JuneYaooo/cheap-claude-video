roles: {}
output_contract:
  final_video: required
video_elements:
  fixed:
    timing_master: narration
    content_before_visual_planning: true
  defaults: {}
  user_overridable: {}
  forbidden:
  - sentence_time_stretch_to_reference
  - asset_switching_as_generation_proof
  - fabricated_tool_interface
copywriting_structure_contract:
  topic_to_angle_required: true
  hook_variants_required: 3
  true_first_line_audit_required: true
  viewer_pressure_required: false
  counterintuitive_thesis_required: false
  natural_language_review_required: true
  concrete_scene_required: true
  cover_title_alignment_required: true
  required_outputs:
  - raw_topic
  - audience_pressure
  - viral_angle_candidates
  - recommended_angle
  - first_3_seconds
  - first_20_seconds
  - script_outline
  - cover_text
  - title
  - risk_notes
  - task
  - tool_name
  - outcome
  - evidence
  - delivery
  opening_gate:
    max_seconds: 3
    must_contain_one_of:
    - a concrete task question grounded in a familiar method or desired result
    - concrete pain
    - identity pressure
    - counterintuitive verdict
    - status or control stake
    - completion gap
    reject_if_only:
    - background setup
    - abstract concept explanation
    - generic advice
    - soft greeting
    - metadata-only hook
    - an isolated implementation detail without the overall task
    - a topic announcement without a viewer question or visible result
